---
layout: default
---

{% assign slug = page.track_slug %}

<meta http-equiv="refresh" content="0; url={{ '/devlog/#' | append: slug | relative_url }}">

<article class="devlog-song-redirect">
  <div class="redirect-inner">
    {% if page.poster_url %}
      <img src="{{ page.poster_url | relative_url }}" alt="{{ page.title }}" class="redirect-poster">
    {% endif %}
    <h1>{{ page.title }}</h1>
    <p>{{ page.description }}</p>
    <p class="redirect-link">
      <a href="{{ '/devlog/#' | append: slug | relative_url }}">View in Dev Log &rarr;</a>
    </p>
  </div>
</article>

<script>
  window.location.replace("{{ '/devlog/#' | append: slug | relative_url }}");
</script>

<style>
  .devlog-song-redirect {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    padding: 2rem;
    text-align: center;
  }
  .redirect-inner {
    max-width: 500px;
  }
  .redirect-poster {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 1.5rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .redirect-inner h1 {
    font-size: 1.8rem;
    margin: 0 0 0.75rem;
  }
  .redirect-inner p {
    opacity: 0.7;
    line-height: 1.6;
  }
  .redirect-link a {
    color: var(--accent-primary, #8b5cf6);
    text-decoration: none;
  }
</style>
